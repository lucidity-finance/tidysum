name: ci

# Every branch push runs the checks on its exact commit, so a pull request from a branch here needs
# no second run; a pull request from a fork runs once on its own. GitHub-hosted runners are free for
# public repositories, and a fork's code never reaches a machine of ours.
on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch replaces a run still in progress. Main is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      # Tests start a throwaway Postgres container (Testcontainers) on the runner's Docker.
      - name: Test
        run: pnpm test
      # The one-step install (decision 0012), the way a user runs it: install.sh into this runner's
      # home, then the page, the commands, the demo and uninstall.
      - name: Install with install.sh
        env:
          TIDYSUM_SOURCE: ${{ github.workspace }}
          TIDYSUM_NO_MODIFY_PATH: "1"
          TIDYSUM_NO_START: "1"
        run: sh install.sh
      - name: Use the installed Tidysum
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          tidysum start
          port="$(sed -n 's/^PORT=//p' "$HOME/.tidysum/.env")"
          curl -fsS "http://127.0.0.1:$port/healthz"
          tidysum status
          tidysum misallocations
          tidysum demo --static "$RUNNER_TEMP/demo"
          test -f "$RUNNER_TEMP/demo/index.html"
          tidysum stop
          tidysum start
          tidysum uninstall
          test ! -e "$HOME/.local/bin/tidysum"
      - name: Show the installed Tidysum's logs
        if: failure()
        run: cat "$HOME/.tidysum/logs/serve.log" "$HOME/.tidysum/postgres/postgres.log" || true
      # A pinned, checksummed gitleaks binary scans the whole history (gitleaks-action needs a
      # license for organization repositories).
      - name: Scan for secrets
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          tarball="$dir/gitleaks.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $tarball" | sha256sum -c --quiet -
          tar -xzf "$tarball" -C "$dir" gitleaks
          "$dir/gitleaks" git --redact --no-banner --exit-code 1 .

  # The same install on a Mac, where most people will run it. GitHub's macOS runners are free for
  # public repositories.
  install-macos:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install with install.sh
        env:
          TIDYSUM_SOURCE: ${{ github.workspace }}
          TIDYSUM_NO_MODIFY_PATH: "1"
          TIDYSUM_NO_START: "1"
        run: sh install.sh
      - name: Use the installed Tidysum
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          tidysum start
          port="$(sed -n 's/^PORT=//p' "$HOME/.tidysum/.env")"
          curl -fsS "http://127.0.0.1:$port/healthz"
          tidysum status
          tidysum misallocations
          tidysum demo --static "$RUNNER_TEMP/demo"
          test -f "$RUNNER_TEMP/demo/index.html"
          tidysum stop
          tidysum start
          tidysum uninstall
          test ! -e "$HOME/.local/bin/tidysum"
      - name: Show the installed Tidysum's logs
        if: failure()
        run: cat "$HOME/.tidysum/logs/serve.log" "$HOME/.tidysum/postgres/postgres.log" || true
